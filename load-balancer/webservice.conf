upstream primes_v1 {
    zone primes_v1 64k;
    resolver consul:8600;
    server service.consul service=primes-v1 resolve;
}

upstream primes_v2 {
    zone primes_v2 64k;
    resolver consul:8600;
    server service.consul service=primes-v2 resolve;
}

server {
    listen 80;

    location /api/v1/primes/ {
        proxy_pass http://primes_v1/;
    }

    location /api/v2/primes/ {
        proxy_pass http://primes_v2/;
    }
}D