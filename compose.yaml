name: kata5-primes

services:
  consul:
    image: hashicorp/consul:1.21.5
    command: agent -dev -client=0.0.0.0 -recursor=127.0.0.11
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD", "consul", "operator", "raft", "list-peers"]
      interval: 2s
      timeout: 2s
      retries: 20

  primes-v1-a:
    build:
      context: .
      dockerfile: primes-service/Dockerfile
    command: ["v1-a", "primes-v1-a", "8080", "http://consul:8500", "primes-v1"]
    depends_on:
      consul:
        condition: service_healthy

  primes-v1-b:
    build:
      context: .
      dockerfile: primes-service/Dockerfile
    command: ["v1-b", "primes-v1-b", "8080", "http://consul:8500", "primes-v1"]
    depends_on:
      consul:
        condition: service_healthy

  primes-v2-a:
    build:
      context: .
      dockerfile: primes-service/Dockerfile
    command: ["v2-a", "primes-v2-a", "8080", "http://consul:8500", "primes-v2"]
    depends_on:
      consul:
        condition: service_healthy

  primes-v2-b:
    build:
      context: .
      dockerfile: primes-service/Dockerfile
    command: ["v2-b", "primes-v2-b", "8080", "http://consul:8500", "primes-v2"]
    depends_on:
      consul:
        condition: service_healthy

  nginx:
    image: nginx:1.28.0
    depends_on:
      consul:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - "./load-balancer/webservice.conf:/etc/nginx/conf.d/default.conf:ro"

  primes-v1-c:
    profiles: ["extra"]
    build:
      context: .
      dockerfile: primes-service/Dockerfile
    command: ["v1-c", "primes-v1-c", "8080", "http://consul:8500", "primes-v1"]
    depends_on:
      consul:
        condition: service_healthy